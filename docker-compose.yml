services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: clinica
    ports:
      - '5434:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U user -d clinica']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    ports:
      - '3001:3000'
    environment:
      PORT: 3000
      DATABASE_URL: postgres://user:password@postgres:5432/clinica
      REDIS_URL: redis://redis:6379
      JWT_SECRET: change_me_in_production
      JWT_EXPIRES_IN: 1d
      DISCORD_WEBHOOK_URL: ''
      GITHUB_WEBHOOK_SECRET: ''
      LOG_LEVEL: info
      CORS_ORIGIN: '*'
      # Tomados del .env local (docker compose interpola ${VAR} desde el .env del proyecto) --
      # nunca hardcodeados aca. Vacios = NodemailerEmailService opera en no-op.
      EMAIL_USER: ${EMAIL_USER:-}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD:-}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-Clinica}
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3000/health || exit 1']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
